name: tread_runner
description: "Companion app for treadmill workouts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  animated_toggle_switch: ^0.8.5
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_analytics: ^12.0.4
  firebase_core: ^4.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_reactive_ble: ^5.4.0
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1

flutter_launcher_icons:
  android: launcher_icon
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#1B1B1E"
  adaptive_icon_foreground: assets/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
